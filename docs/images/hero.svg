<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">Vidura: agentic HR assistant</title>
  <desc id="d">Plain-language requests become validated, permission-checked HR actions.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E7E5DE"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B1D1C" flood-opacity=".09"/></filter>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#F6F5F1"/><stop offset=".55" stop-color="#F6F5F1" stop-opacity=".2"/><stop offset="1" stop-color="#F6F5F1" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="460" rx="22" fill="#F6F5F1"/>
  <rect width="1280" height="460" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="460" rx="22" fill="url(#fade)"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <g transform="translate(72 78)">
      <path d="M20 2c4.5 4.2 6.8 9 6.8 14S24.5 25.3 20 29.5C15.5 25.3 13.2 20.8 13.2 16S15.5 6.2 20 2z" fill="#2F5D50"/>
      <path d="M5 12c5.9.5 10.4 3 13.3 7.5 1.2 2.1 1.7 5.4 1.7 10-5.5-.8-9.7-3-12.2-7C6.1 20 5.2 16.4 5 12z" fill="#2F5D50" opacity=".7"/>
      <path d="M35 12c-5.9.5-10.4 3-13.3 7.5-1.2 2.1-1.7 5.4-1.7 10 5.5-.8 9.7-3 12.2-7 1.7-2.5 2.6-6.1 2.8-10.5z" fill="#2F5D50" opacity=".7"/>
      <path d="M7 34h26" stroke="#B0703C" stroke-width="2.5" stroke-linecap="round"/>
      <text x="52" y="29" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#1B1D1C">Vidura</text>
      <text x="168" y="28" font-size="13" font-weight="600" fill="#8A4F22" letter-spacing="1.5">विदुर · AGENTIC HR</text>
    </g>
    <text x="72" y="196" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#1B1D1C">Wise counsel for</text>
    <text x="72" y="258" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#1B1D1C" font-style="italic">people operations.</text>
    <text x="72" y="306" font-size="19" fill="#5B605D">Ask in plain language. Vidura validates the request, checks your</text>
    <text x="72" y="334" font-size="19" fill="#5B605D">role and acts: over chat, the dashboard or the Model Context Protocol.</text>
    <g font-size="14" font-weight="600" transform="translate(72 372)">
      <rect width="92" height="32" rx="16" fill="#E3ECE8"/><text x="46" y="21" text-anchor="middle" fill="#2F5D50">Leave</text>
      <rect x="102" width="100" height="32" rx="16" fill="#E3ECE8"/><text x="152" y="21" text-anchor="middle" fill="#2F5D50">Tickets</text>
      <rect x="212" width="122" height="32" rx="16" fill="#E3ECE8"/><text x="273" y="21" text-anchor="middle" fill="#2F5D50">Onboarding</text>
      <rect x="344" width="88" height="32" rx="16" fill="#E3ECE8"/><text x="388" y="21" text-anchor="middle" fill="#2F5D50">Hiring</text>
      <rect x="442" width="96" height="32" rx="16" fill="#F4E6DA"/><text x="490" y="21" text-anchor="middle" fill="#8A4F22">RBAC</text>
      <rect x="548" width="80" height="32" rx="16" fill="#F4E6DA"/><text x="588" y="21" text-anchor="middle" fill="#8A4F22">MCP</text>
    </g>
  </g>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" transform="translate(770 58)">
    <rect width="440" height="344" rx="16" fill="#FFF" stroke="#E0DED6" filter="url(#sh)"/>
    <circle cx="26" cy="24" r="5" fill="#E0DED6"/><circle cx="42" cy="24" r="5" fill="#E0DED6"/><circle cx="58" cy="24" r="5" fill="#E0DED6"/>
    <text x="416" y="28" text-anchor="end" font-size="12" fill="#5B605D">Aditi Sharma · Employee</text>
    <rect x="96" y="46" width="320" height="58" rx="12" fill="#2F5D50"/>
    <text x="116" y="71" font-size="15" fill="#FFF">Apply sick leave next Monday</text>
    <text x="116" y="92" font-size="15" fill="#FFF">for 2 days, I have a fever.</text>
    <g transform="translate(24 120)">
      <rect width="392" height="88" rx="10" fill="#F6F5F1" stroke="#D5D2C8" stroke-dasharray="4 4"/>
      <text x="16" y="25" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#2F5D50">apply_leave(</text>
      <text x="30" y="45" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#5B605D">start_date="2026-11-16", days=2,</text>
      <text x="30" y="65" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#5B605D">leave_type="sick", reason="Fever")</text>
      <text x="378" y="25" text-anchor="end" font-size="10.5" font-weight="700" fill="#8A4F22" letter-spacing=".8">TOOL CALL</text>
    </g>
    <g font-size="13" fill="#1B1D1C" transform="translate(32 232)">
      <circle r="8" fill="#E3ECE8"/><path d="M-4 0l3 3 5-6" stroke="#2F5D50" stroke-width="2" fill="none"/><text x="14" y="4.5">Role check</text>
      <circle cx="120" r="8" fill="#E3ECE8"/><path d="M116 0l3 3 5-6" stroke="#2F5D50" stroke-width="2" fill="none"/><text x="134" y="4.5">No overlap</text>
      <circle cx="238" r="8" fill="#F4E6DA"/><text x="238" y="4.5" text-anchor="middle" font-weight="800" fill="#8A4F22">!</text><text x="252" y="4.5">Team coverage</text>
    </g>
    <rect x="24" y="256" width="392" height="66" rx="12" fill="#E3ECE8"/>
    <text x="42" y="283" font-size="15" font-weight="700" fill="#1B1D1C">Leave #7 submitted · Mon 16 – Tue 17 Nov</text>
    <text x="42" y="305" font-size="13.5" fill="#43504B">Heads-up: Arjun and Gauri (Engineering) are also off.</text>
  </g>
</svg>
