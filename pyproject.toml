[project]
name = "vidura-agentic-hr-assistant"
version = "1.0.0"
description = "Vidura: HR operations app with a tool-calling AI assistant, role-based access control and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
authors = [{ name = "Ch Sai Kaushik" }]
dependencies = [
    "fastmcp>=3.3.1,<4",
    "langchain>=1.3.1,<2",
    "langchain-core>=1.4.0,<2",
    "langchain-groq>=1.1.2,<2",
    "pandas>=2.2,<4",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    "streamlit>=1.57.0,<2",
]

[project.scripts]
hr-mcp = "hr_assistant.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hr_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:anyio"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
