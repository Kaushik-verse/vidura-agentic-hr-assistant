[theme]
base = "light"
primaryColor = "#2F5D50"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#ECEAE3"
textColor = "#1B1D1C"
borderColor = "#E0DED6"
linkColor = "#2F5D50"
baseRadius = "8px"
font = "Instrument Sans:https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
codeFont = "monospace"
chartCategoricalColors = ["#2F5D50", "#B0703C", "#6C7A89", "#8C5A7A", "#7A8B4F"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F2EE"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
headless = true
